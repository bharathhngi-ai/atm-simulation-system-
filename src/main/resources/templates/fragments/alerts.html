<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="alerts">
    <!-- Success Alert -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show auto-dismiss shadow-sm d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-check-circle-fill me-2 fs-5"></i>
        <div class="flex-grow-1" th:text="${successMessage}">Operation completed successfully.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show auto-dismiss shadow-sm d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
        <div class="flex-grow-1" th:text="${errorMessage}">An error occurred.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Warning Alert -->
    <div th:if="${warningMessage}" class="alert alert-warning alert-dismissible fade show auto-dismiss shadow-sm d-flex align-items-center mb-4" role="alert">
        <i class="bi bi-shield-exclamation me-2 fs-5"></i>
        <div class="flex-grow-1" th:text="${warningMessage}">Warning notice.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>
</html>

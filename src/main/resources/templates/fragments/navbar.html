<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav th:fragment="navbar" class="top-navbar">
    <div class="d-flex align-items-center gap-3">
        <button id="sidebarToggle" class="btn btn-outline-secondary btn-sm d-lg-none" type="button">
            <i class="bi bi-list fs-5"></i>
        </button>
        <div class="d-none d-sm-flex align-items-center text-muted gap-2 small">
            <i class="bi bi-shield-check text-success"></i>
            <span>256-bit SSL Banking Protection</span>
            <span class="mx-1">•</span>
            <i class="bi bi-clock"></i>
            <span id="liveClock">--:--:--</span>
        </div>
    </div>

    <div class="d-flex align-items-center gap-3">
        <!-- Account Status Badge if customer -->
        <div sec:authorize="hasRole('CUSTOMER')" th:if="${account}" class="d-none d-md-flex align-items-center gap-2">
            <span class="text-muted small">Account:</span>
            <span class="badge bg-light text-dark border px-2 py-1 font-monospace" th:text="${account.accountNumber}">1001XXXXXXXX</span>
            <span th:if="${account.active}" class="badge badge-status badge-active">ACTIVE</span>
            <span th:if="${account.frozen}" class="badge badge-status badge-frozen"><i class="bi bi-snow2 me-1"></i>FROZEN</span>
        </div>

        <!-- Notifications Bell -->
        <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/notifications}" class="btn btn-light position-relative rounded-circle p-2" title="Notifications">
            <i class="bi bi-bell text-secondary fs-6"></i>
            <span th:if="${unreadCount != null && unreadCount > 0}"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light"
                  th:text="${unreadCount}">1</span>
        </a>

        <!-- User Dropdown Menu -->
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2 border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width: 34px; height: 34px;">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="d-none d-md-block text-start">
                    <div class="fw-semibold small text-truncate" style="max-width: 140px;" sec:authentication="name">User</div>
                    <div class="text-muted" style="font-size: 0.72rem;" sec:authorize="hasRole('ADMIN')">Administrator</div>
                    <div class="text-muted" style="font-size: 0.72rem;" sec:authorize="hasRole('CUSTOMER')">Customer</div>
                </div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                <li sec:authorize="hasRole('CUSTOMER')">
                    <a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person-gear me-2"></i>My Profile</a>
                </li>
                <li sec:authorize="hasRole('CUSTOMER')">
                    <a class="dropdown-item py-2" th:href="@{/security/settings}"><i class="bi bi-shield-lock me-2"></i>Security Settings</a>
                </li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a class="dropdown-item py-2" th:href="@{/admin/statistics}"><i class="bi bi-graph-up me-2"></i>System Statistics</a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item py-2 text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Sign Out Safely
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('ATM Cash Deposit')}">
    <title>ATM Cash Deposit</title>
</head>
<body>
    <div class="app-wrapper">
        <aside th:replace="~{fragments/sidebar :: sidebar('deposit')}"></aside>

        <main class="main-content">
            <nav th:replace="~{fragments/navbar :: navbar}"></nav>

            <div class="content-body">
                <div th:replace="~{fragments/alerts :: alerts}"></div>

                <div class="mb-4">
                    <h4 class="fw-bold text-dark mb-1"><i class="bi bi-arrow-down-circle text-success me-2"></i>Cash Deposit</h4>
                    <p class="text-muted small mb-0">Deposit cash securely into your bank account</p>
                </div>

                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="card card-banking">
                            <div class="card-header-banking">
                                <span><i class="bi bi-cash-stack text-success me-2"></i>Instant ATM Deposit Form</span>
                                <span class="badge bg-light text-secondary border font-monospace" th:text="'Account: ' + ${account.accountNumber}">Account #</span>
                            </div>
                            <div class="card-body p-4">
                                <form th:action="@{/transactions/deposit}" th:object="${depositDto}" method="post">
                                    <input type="hidden" th:field="*{idempotencyKey}">

                                    <!-- Quick Amount Chips -->
                                    <label class="form-label fw-semibold small text-secondary">Quick Select Amount</label>
                                    <div class="d-flex flex-wrap gap-2 mb-3">
                                        <button type="button" class="btn btn-outline-secondary btn-sm amount-chip" data-amount="50.00" data-target="amount">₹50</button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm amount-chip" data-amount="100.00" data-target="amount">₹100</button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm amount-chip" data-amount="200.00" data-target="amount">₹200</button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm amount-chip" data-amount="500.00" data-target="amount">₹500</button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm amount-chip" data-amount="1000.00" data-target="amount">₹1,000</button>
                                        <button type="button" class="btn btn-outline-secondary btn-sm amount-chip" data-amount="5000.00" data-target="amount">₹5,000</button>
                                    </div>

                                    <!-- Custom Amount -->
                                    <div class="mb-3">
                                        <label for="amount" class="form-label fw-semibold small text-secondary">Deposit Amount (₹) *</label>
                                        <div class="input-group input-group-lg">
                                            <span class="input-group-text bg-light text-success fw-bold">₹</span>
                                            <input type="number" step="0.01" min="10.00" max="500000.00" id="amount" th:field="*{amount}" class="form-control font-monospace" placeholder="0.00" required autofocus>
                                        </div>
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                                        <div class="form-text small">Minimum deposit: ₹10.00 • Maximum: ₹500,000.00</div>
                                    </div>

                                    <!-- Description / Memo -->
                                    <div class="mb-4">
                                        <label for="description" class="form-label fw-semibold small text-secondary">Deposit Remarks (Optional)</label>
                                        <input type="text" id="description" th:field="*{description}" class="form-control" placeholder="ATM Cash Deposit">
                                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                                    </div>

                                    <div class="bg-light p-3 rounded mb-4 d-flex justify-content-between align-items-center">
                                        <span class="text-muted small">Current Balance:</span>
                                        <strong class="font-monospace text-primary" th:text="'₹' + ${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">₹0.00</strong>
                                    </div>

                                    <button type="submit" class="btn btn-success w-100 py-3 fw-semibold shadow-sm">
                                        <i class="bi bi-check-circle me-1"></i> Confirm &amp; Deposit Cash
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>

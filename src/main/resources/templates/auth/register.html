<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Register Customer Account')}">
    <title>Register Account</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card card-banking border-0 shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3 shadow" style="width: 56px; height: 56px;">
                                <i class="bi bi-person-plus-fill fs-3"></i>
                            </div>
                            <h3 class="fw-bold text-dark mb-1">Open a New Bank Account</h3>
                            <p class="text-muted small">Register instantly with an initial deposit and create your secure 4-digit ATM PIN</p>
                        </div>

                        <!-- Alerts -->
                        <div th:replace="~{fragments/alerts :: alerts}"></div>

                        <!-- Form -->
                        <form th:action="@{/register}" th:object="${registerDto}" method="post">
                            <h6 class="fw-bold text-primary text-uppercase small mb-3 border-bottom pb-2">
                                <i class="bi bi-person-badge me-1"></i> Personal Information
                            </h6>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Username *</label>
                                    <input type="text" th:field="*{username}" class="form-control" placeholder="Choose username" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Full Legal Name *</label>
                                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="e.g. John Doe" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Email Address *</label>
                                    <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Phone Number *</label>
                                    <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="+1 555-0199" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label small fw-semibold text-secondary">Residential Address *</label>
                                <input type="text" th:field="*{address}" class="form-control" placeholder="Street, City, Zip Code" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <h6 class="fw-bold text-primary text-uppercase small mb-3 border-bottom pb-2">
                                <i class="bi bi-shield-lock me-1"></i> Credentials & ATM Setup
                            </h6>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Password *</label>
                                    <input type="password" th:field="*{password}" class="form-control" placeholder="Min. 6 characters" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold text-secondary">Confirm Password *</label>
                                    <input type="password" th:field="*{confirmPassword}" class="form-control" placeholder="Repeat password" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold text-secondary">Account Type *</label>
                                    <select th:field="*{accountType}" class="form-select">
                                        <option value="SAVINGS">Savings Account</option>
                                        <option value="CHECKING">Checking Account</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold text-secondary">4-Digit ATM PIN *</label>
                                    <input type="password" th:field="*{atmPin}" class="form-control font-monospace" placeholder="••••" maxlength="4" pattern="[0-9]{4}" required>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('atmPin')}" th:errors="*{atmPin}"></div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-semibold text-secondary">Opening Deposit (₹) *</label>
                                    <div class="input-group">
                                        <span class="input-group-text">₹</span>
                                        <input type="number" step="0.01" min="500.00" th:field="*{initialDeposit}" class="form-control" placeholder="500.00" required>
                                    </div>
                                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('initialDeposit')}" th:errors="*{initialDeposit}"></div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                                <i class="bi bi-check2-circle me-1"></i> Complete Registration & Open Account
                            </button>
                        </form>

                        <div class="text-center small text-muted">
                            Already registered?
                            <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none ms-1">Sign In</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
